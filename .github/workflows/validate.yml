name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate packages and run end-to-end tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm test

  cursor-cloud:
    name: Cursor Cloud continuity Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Qualify Cursor Cloud continuity
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node tools/cursor-cloud/qualify.mjs
      - name: Run Cursor Cloud continuity tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node --test tests/cursor-cloud-continuity.test.mjs
